[project]
name = "dloan"
version = "0.1.0"
description = "Agentic Gen AI Loan Applicant Screening System"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "streamlit>=1.40.0",
    "langgraph>=0.3.0",
    "groq>=0.18.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
    "django>=6.0.6",
    "djangorestframework>=3.17.1",
    "django-cors-headers>=4.9.0",
    "pyjwt>=2.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.6.0",
]
